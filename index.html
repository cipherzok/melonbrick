<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>melonbrick 2.0.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff@9.0.0/dist/diff.min.js"></script>
    <script src="https://unpkg.com/pako@2.2.0/dist/pako.js"></script>
    <script src="jszip.js"></script>
    <script src="diff.js"></script>
    <script src="main.js" type="module"></script>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="file-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-down preview-icon">
            <path
                d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
            <path d="M14 2v5a1 1 0 0 0 1 1h5" />
            <path d="M12 12v6" />
            <path d="m15 15-3-3-3 3" />
        </symbol>
    </svg>

    <div class="main">
        <h1>Mine Blocks 1.31.2</h1>

        <div class="row">
            <label>32-bit EXE</label>
            <div class="import-file" id="import-exe">
                <svg class="icon">
                    <use href="#file-down" />
                </svg>
                <p id="exe-file-name">No file selected</p>
            </div>
        </div>

        <div class="row">
            <label>JavaScript</label>
            <div class="import-file" id="import-js">
                <svg class="icon">
                    <use href="#file-down" />
                </svg>
                <p id="js-file-name">No file selected</p>
            </div>
        </div>

        <div class="center-box">
            <button id="download">Download</button>
        </div>
        <p id="log"></p>
    </div>
</body>

</html>
